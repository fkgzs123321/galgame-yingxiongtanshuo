<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
</head>
<body>
<div id="yxopen-root">
<style>
.gg4{--bg1:#12161f;--bg2:#1a1f2b;--line:#2b3344;--ink:#d8dff0;--dim:#79839c;--gold:#e8b84b;--grn:#6fcf97;
 font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
 max-width:620px;margin:12px auto;padding:2px}
.gg4 *{box-sizing:border-box}
.gg4 h3{margin:0 0 3px;font-size:18px;font-weight:700;letter-spacing:.5px}
.gg4 .sub{font-size:12px;color:var(--dim);margin-bottom:11px;line-height:1.7}
.gg4 .list{display:grid;gap:7px}
.gg4 .c{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;padding:10px 12px;border-radius:12px;
 cursor:pointer;transition:.16s;background:linear-gradient(180deg,var(--bg2),var(--bg1));border:1px solid var(--line)}
.gg4 .c:hover{border-color:#41506b;transform:translateY(-1px)}
.gg4 .c[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 1px rgba(232,184,75,.3),0 0 22px -10px rgba(232,184,75,.7)}
.gg4 .n{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
 font-size:16px;font-weight:700;background:#0d1119;border:1px solid var(--line);color:var(--gold)}
.gg4 .t1{font-size:14px;font-weight:600;margin-bottom:2px}
.gg4 .t2{font-size:11.5px;color:var(--dim);line-height:1.6}
.gg4 .tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;margin-left:6px;border:1px solid currentColor;opacity:.8;color:var(--dim)}
.gg4 .foot{display:flex;gap:9px;align-items:center;margin-top:11px;flex-wrap:wrap}
.gg4 button{font:inherit;font-size:13px;padding:8px 15px;border-radius:9px;cursor:pointer;transition:.16s;
 background:#1a1f2b;border:1px solid var(--line);color:var(--ink)}
.gg4 button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.gg4 button:disabled{opacity:.4;cursor:not-allowed}
.gg4 button.ok{background:linear-gradient(180deg,rgba(232,184,75,.22),rgba(232,184,75,.1));border-color:rgba(232,184,75,.5);color:#f2d79a}
.gg4 .pick{font-size:12px;color:var(--dim)}
.gg4 .done{margin-top:9px;font-size:12px;padding:8px 11px;border-radius:9px;display:none;
 background:rgba(111,207,151,.07);border:1px solid rgba(111,207,151,.32);color:var(--grn);line-height:1.7}
.gg4 .done.on{display:block}
</style>
<div class="gg4">
  <h3>选一个人来玩你</h3>
  <div class="sub">同一个十四岁，同一个镇口。不一样的是她。<br>选的时候想清楚 —— 她怎么玩，你就怎么过这两年。</div>
  <div class="list" id="gg4-list"></div>
  <div class="foot"><button id="gg4-ok" class="ok" disabled>确认，开始</button><span class="pick" id="gg4-pick">还没选</span></div>
  <div class="done" id="gg4-done"></div>
</div>
</div>
<script>
(function () {
  var NS = 'gg4';
  var ROOT = document.getElementById(NS + '-root');
  if (!ROOT || ROOT.getAttribute('data-' + NS + '-init') === '1') return;
  ROOT.setAttribute('data-' + NS + '-init', '1');
  // ★ 顺序必须和 first_messages 一致：2=温砚 3=丰娆 4=舒晏 5=唐响 6=沈眠 7=莫漾 8=纪清 9=郁灼
  var 套 = [
    { k: '温砚', 号: '砚', 句: '我要带你走到最好的那个结局。', 注: '开局前查两小时攻略，点选项前先看你在哪', tag: ['温柔', '最难'] },
    { k: '丰娆', 号: '娆', 句: '快一点，我不想等。', 注: '翻得飞快，只挑最近的一条路', tag: ['急躁'] },
    { k: '舒晏', 号: '晏', 句: '我想看你能忍到什么时候。', 注: '故意挑难走的那条，还反复看同一段', tag: ['玩弄', 'risk'] },
    { k: '唐响', 号: '响', 句: '哪个能打？就它了。', 注: '不查攻略，先撞上去再说', tag: ['莽', 'risk'] },
    { k: '沈眠', 号: '眠', 句: '你别被谁救走。', 注: '她点选项的唯一标准是「这会不会让你被救」', tag: ['最静'] },
    { k: '莫漾', 号: '漾', 句: '随便吧，先挂着。', 注: '手离开鼠标，看着你自己站着', tag: ['挂机'] },
    { k: '纪清', 号: '清', 句: '这个数不对。我得先算清楚。', 注: '她不是在玩，是在把这儿摸透', tag: ['全收集', 'risk'] },
    { k: '郁灼', 号: '灼', 句: '前面这些都没意思，我要看后面。', 注: '只挑最刺激的那几段，其余全跳', tag: ['极端', 'risk'] }
  ];
  var 选中 = '';
  function allVars() { try { return (typeof getVariables === 'function' ? getVariables({ type: 'chat' }) : {}) || {}; } catch (e) { return {}; } }
  function walk(o, p) { var q = String(p || '').replace(/^stat_data\./, '').split('.'); var c = (o && o.stat_data !== undefined) ? o.stat_data : o; for (var i = 0; i < q.length && c != null; i++) c = c[q[i]]; return c; }
  function get(p, d) { var v = walk(allVars(), p); return v === undefined || v === null ? d : v; }
  function setLocal(o, p, v) { var q = String(p).replace(/^stat_data\./, '').split('.'); if (o.stat_data === undefined) o.stat_data = {}; var c = o.stat_data; for (var i = 0; i < q.length - 1; i++) { if (typeof c[q[i]] !== 'object' || c[q[i]] === null) c[q[i]] = {}; c = c[q[i]]; } c[q[q.length - 1]] = v; }
  function set(p, v) { var full = 'stat_data.' + String(p).replace(/^stat_data\./, ''); try { if (typeof updateVariablesWith === 'function') updateVariablesWith(function (x) { x = x || {}; setLocal(x, full, v); return x; }, { type: 'chat' }); } catch (e) {} }
  var 当前 = String(get('她.人设', '') || '');
  function render() {
    var list = document.getElementById(NS + '-list');
    list.innerHTML = 套.map(function (s) {
      var on = (s.k === 选中);
      return '<div class="c" data-k="' + s.k + '" role="button" tabindex="0" aria-pressed="' + on + '">'
        + '<div class="n">' + s.号 + '</div><div><div class="t1">' + s.k
        + s.tag.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('')
        + '</div><div class="t2">' + s.句 + '<br>' + s.注 + '</div></div></div>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#' + NS + '-list .c'), function (el) {
      el.addEventListener('click', function () { 选中 = el.getAttribute('data-k'); render(); });
    });
    var ok = document.getElementById(NS + '-ok');
    ok.disabled = !选中 || !!当前;
    ok.textContent = 选中 ? ('确认「' + 选中 + '」，开始') : '确认，开始';
    document.getElementById(NS + '-pick').textContent = 选中 ? ('已选 ' + 选中 + '，点确认才生效') : '还没选';
    if (当前) { var d = document.getElementById(NS + '-done'); d.className = 'done on'; d.textContent = '已经定了：' + 当前 + '。往上滑一层就是开局正文。'; ok.disabled = true; }
  }
  async function 确认() {
    if (!选中 || 当前) return;
    var ok = document.getElementById(NS + '-ok');
    ok.disabled = true; ok.textContent = '正在开局…';
    set('她.人设', 选中); set('她.目的进度', 0);
    var 序 = 0; for (var i = 0; i < 套.length; i++) if (套[i].k === 选中) 序 = i;
    var d = document.getElementById(NS + '-done');
    try {
      if (typeof setChatMessages === 'function') {
        await setChatMessages([{ message_id: 0, swipe_id: 2 + 序 }]);
        d.className = 'done on'; d.textContent = '已确认「' + 选中 + '」，切到她的开局了。往上滑一层就是正文。';
      } else throw new Error('没有 setChatMessages');
    } catch (e) {
      d.className = 'done on'; d.textContent = '变量已写入（她：' + 选中 + '），切层失败：' + (e && e.message) + '。手动切到那一层即可。';
    }
  }
  document.getElementById(NS + '-ok').addEventListener('click', 确认);
  render();
})();
</script>
</body>
</html>
