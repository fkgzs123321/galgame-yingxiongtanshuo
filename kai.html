<!DOCTYPE html>

<body>
<!-- 底座_nanpa2 · 开局表单（<OpeningSelectUI/>）
     依据 skills references/contents-creation/first-message.md:98-110「表单式」：
       「玩家在表单里选择/填写后，替换脚本（前端界面）负责**生成或发送对应的开场白场景**，再进行后续流程」
       「表单本身即开局入口，选项决定被发送/触发的开场场景」
     所以选完必须做两件事：① 写 MVU 变量 ② **触发对应的开场场景**（原先只做了①、没做②） -->

<div class="gg4" id="gg4-root" data-gg4-init="">
  <h3>选一个人来玩你</h3>
  <div class="sub">同一个十四岁，同一个镇口。不一样的是她。<br>选的时候想清楚：她怎么玩，你就怎么过这两年。</div>
  <div class="list" id="gg4-list"></div>
  <div class="bar">
    <button type="button" id="gg4-ok" disabled>确认，开始</button>
    <span class="hint" id="gg4-pick">还没选</span>
  </div>
  <div class="done" id="gg4-done"></div>
  <div class="hint">（八个「她」，八个玩法。选一个，点确认 —— 会切进她的那一局。）</div>
</div>
<script>
 
(function () {
  var NS = 'gg4';
  var ROOT = document.getElementById(NS + '-root');
  if (!ROOT || ROOT.getAttribute('data-' + NS + '-init') === '1') return;
  ROOT.setAttribute('data-' + NS + '-init', '1');

  var 套 = [
    { k: '温砚', 号: '砚', 句: '我要带你走到最好的那个结局。', 注: '开局前查两小时攻略，点选项前先看你在哪', tag: ['温柔', 'calm'] },
    { k: '丰娆', 号: '娆', 句: '快一点，我不想等。', 注: '翻得飞快，只挑最近的一条路', tag: ['急躁', 'mid'] },
    { k: '舒晏', 号: '晏', 句: '我想看你能忍到什么时候。', 注: '故意挑难走的那条，还反复看同一段', tag: ['玩弄', 'risk'] },
    { k: '唐响', 号: '响', 句: '哪个能打？就它了。', 注: '不查攻略，先撞上去再说', tag: ['莽', 'risk'] },
    { k: '沈眠', 号: '眠', 句: '你别被谁救走。', 注: '她点选项的唯一标准是「这会不会让你被救」', tag: ['最静', 'calm'] },
    { k: '莫漾', 号: '漾', 句: '随便吧，先挂着。', 注: '手离开鼠标，看着你自己站着', tag: ['挂机', 'mid'] },
    { k: '纪清', 号: '清', 句: '这个数不对。我得先算清楚。', 注: '她不是在玩，是在把这儿摸透', tag: ['全收集', 'risk'] },
    { k: '郁灼', 号: '灼', 句: '前面这些都没意思，我要看后面。', 注: '只挑最刺激的那几段，其余全跳', tag: ['极端', 'risk'] }
  ];
  var 选中 = '';

  function allVars() {
    try { return (typeof getVariables === 'function' ? getVariables({ type: 'chat' }) : {}) || {}; }
    catch (e) { return {}; }
  }
  function walk(o, p) {
    var q = String(p || '').replace(/^stat_data\./, '').split('.');
    var c = (o && o.stat_data !== undefined) ? o.stat_data : o;
    for (var i = 0; i < q.length && c != null; i++) c = c[q[i]];
    return c;
  }
  function get(p, d) { var v = walk(allVars(), p); return v === undefined || v === null ? d : v; }
  function setLocal(o, p, v) {
    var q = String(p).replace(/^stat_data\./, '').split('.');
    if (o.stat_data === undefined) o.stat_data = {};
    var c = o.stat_data;
    for (var i = 0; i < q.length - 1; i++) { if (typeof c[q[i]] !== 'object' || c[q[i]] === null) c[q[i]] = {}; c = c[q[i]]; }
    c[q[q.length - 1]] = v;
  }
  function set(p, v) {
    var full = 'stat_data.' + String(p).replace(/^stat_data\./, '');
    try { if (typeof updateVariablesWith === 'function') updateVariablesWith(function (x) { x = x || {}; setLocal(x, full, v); return x; }, { type: 'chat' }); } catch (e) {}
    try {
      if (typeof updateVariablesWith === 'function' && typeof getCurrentMessageId === 'function')
        updateVariablesWith(function (x) { x = x || {}; setLocal(x, full, v); return x; }, { type: 'message', message_id: getCurrentMessageId() });
    } catch (e) {}
    try { if (typeof triggerSlash === 'function') triggerSlash('/setvar ' + full + ' ' + JSON.stringify(JSON.stringify(v))); } catch (e) {}
  }

  function render() {
    var 当前 = String(get('她.人设', '') || '');
    if (!选中) 选中 = 当前;
    document.getElementById(NS + '-list').innerHTML = 套.map(function (x) {
      return '<div class="c" role="button" tabindex="0" aria-pressed="' + (选中 === x.k) + '" data-k="' + x.k + '">'
        + '<span class="n">' + x.号 + '</span>'
        + '<span><span class="t">' + x.k + '<span class="tag ' + x.tag[1] + '">' + x.tag[0] + '</span></span>'
        + '<span class="d">「' + x.句 + '」<br>' + x.注 + '</span></span>'
        + '<span class="ck">✓</span></div>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#' + NS + '-list .c'), function (el) {
      el.addEventListener('click', function () { 选中 = el.getAttribute('data-k'); render(); });
      el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); 选中 = el.getAttribute('data-k'); render(); } });
    });
    var ok = document.getElementById(NS + '-ok');
    ok.disabled = !选中;
    ok.textContent = 选中 ? ('确认「' + 选中 + '」，开始') : '确认，开始';
    document.getElementById(NS + '-pick').textContent = 选中 ? ('已选 ' + 选中 + '，点确认才生效') : '还没选';
    if (当前) {
      var d = document.getElementById(NS + '-done');
      d.className = 'done on';
      d.textContent = '已经定了：' + 当前;
      ok.disabled = true;
    }
  }

  // ★ 关键：确认后要「触发对应的开场场景」（skills first-message.md:110）
  // ★ 2026-09-17 重写。两件事原来都想错了：
  //   ① setChatMessages 可能**静默失败**（不抛错也不生效）→ 走不到兜底分支
  //   ② ★ setChatMessages 只是「切换第 0 条消息的 swipe」（换开头正文），
  //      **它不会产生新的一楼** → 玩家点了确认，游戏并没有开始
  //      → 真正让游戏跑起来的是 generate()。所以：切完 swipe，**必然**再调一次 generate。
  //   每一步都写在 done 区，卡在哪一眼能看见。
  function 报(话) {
    var d = document.getElementById(NS + '-done');
    if (!d) return;
    d.className = 'done on';
    d.textContent = 话;
  }

  async function 确认() {
    if (!选中) return;
    var ok = document.getElementById(NS + '-ok');
    ok.disabled = true; ok.textContent = '正在开局…';

    var 序 = 0;
    for (var i = 0; i < 套.length; i++) if (套[i].k === 选中) 序 = i;
    var swipe_id = 2 + 序;

    // ── ① 写变量 ──
    报('① 正在写变量（她 = ' + 选中 + '）…');
    set('她.人设', 选中);
    set('她.目的进度', 0);
    set('她.已拿到', 0);

    // ── ② 切到她的那段开场白（换掉面前这一屏），失败不影响后面 ──
    var 切层原因 = '';
    try {
      if (typeof setChatMessages !== 'function') throw new Error('这个环境没有 setChatMessages');
      报('② 正在切到第 ' + swipe_id + ' 段开场白…');
      await setChatMessages([{ message_id: 0, swipe_id: swipe_id }]);
    } catch (e) {
      切层原因 = (e && e.message ? e.message : String(e));
    }

    // ── ③ ★ 不管切没切成，都要「真的开始玩」──
    //    这一步才是让游戏跑起来的那一步。
    try {
      if (typeof generate !== 'function') throw new Error('这个环境没有 generate');
      报('③ 正在让「' + 选中 + '」开第一局…（写完会出现在新的一楼）');
      await generate({
        user_input: '【开局】屏幕外的她选了「' + 选中 + '」这一套。'
          + '按这一套人设、从第一天开始，写第一层正文。'
          + '四段结构：先交代她点了第几条（以及那条是什么）→ 写 <user> 的反应 → 把这件事做完 → '
          + '末尾摆出下一层的四条选项写进 局面.当前选项。'
          + '写完照常输出 <UpdateVariable> 与末尾那一行 <StatusPlaceHolderImpl/>。',
        should_stream: true,
      });
      报('✅ 已确认「' + 选中 + '」，她开第一局了。往下看新的一楼。'
        + (切层原因 ? '（顺带：切层没成，' + 切层原因 + '，不影响玩）' : ''));
      ok.textContent = '已开局';
    } catch (e3) {
      报('✗ 没能自动开始。'
        + (切层原因 ? '切层也失败了（' + 切层原因 + '）。' : '')
        + 'AI 那边：' + (e3 && e3.message ? e3.message : e3)
        + '　→ 手动切到「' + 选中 + '」那一段，或者直接在输入框里发一句话开始。');
      ok.disabled = false;
      ok.textContent = '再试一次';
    }
  }

  document.getElementById(NS + '-ok').addEventListener('click', 确认);
  render();
  try {
    var ctx = (typeof SillyTavern !== 'undefined' && SillyTavern.getContext) ? SillyTavern.getContext() : null;
    if (ctx && ctx.eventSource && ctx.eventTypes) {
      [ctx.eventTypes.MESSAGE_UPDATED, ctx.eventTypes.CHAT_CHANGED].forEach(function (t) {
        if (t) ctx.eventSource.on(t, function () { try { render(); } catch (e) {} });
      });
    }
  } catch (e) {}
})();
 
</script>
</body>
</html>
